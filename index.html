  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .ti { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; stroke: currentColor; }

    :root {
      --bg:            #f5f5f2;
      --surface:       #ffffff;
      --surface-alt:   #f0efeb;
      --border:        rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.20);
      --text:          #1a1a18;
      --text-secondary:#5f5e5a;
      --text-muted:    #9a9890;
      --accent:        #185fa5;
      --accent-bg:     #e6f1fb;
      --radius:        8px;
      --font:          system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:            #1c1c1a;
        --surface:       #2a2a28;
        --surface-alt:   #232321;
        --border:        rgba(255,255,255,0.10);
        --border-strong: rgba(255,255,255,0.18);
        --text:          #eeecea;
        --text-secondary:#a8a7a2;
        --text-muted:    #6e6d69;
        --accent:        #85b7eb;
        --accent-bg:     #042c53;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

.brand {
  display: flex;
  align-items: center;
  gap: 0.1rem;
  margin-bottom: 1.5rem;
}

.brand-logo {
  width: 40px;
  height: auto;
  display: block;
}

.brand-name {
  font-size: 2.1rem;
  font-weight: 900;
  font-style: italic;
  font-family: "Barlow Semi Condensed", system-ui, sans-serif;
  letter-spacing: 0.06em;
  color: rgb(95, 161, 171);
}

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-right: 12px;
      border-right: 0.5px solid var(--border-strong);
    }

    .toolbar-group:last-child { border-right: none; padding-right: 0; }

    label.tb { font-size: 13px; color: var(--text-secondary); }

    input[type="date"] {
      font-size: 13px; font-family: var(--font);
      padding: 7px 10px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border-strong);
      background: var(--surface); color: var(--text);
      outline: none; cursor: pointer;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24,95,165,0.15);
    }

    button {
      font-size: 13px; font-family: var(--font);
      padding: 7px 12px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border-strong);
      background: var(--surface); color: var(--text);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.1s;
      white-space: nowrap;
    }

    button:hover  { background: var(--surface-alt); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:disabled:hover { background: var(--surface); }
    button:disabled:active { transform: none; }
    .zoom-btn { padding: 7px 10px; }

    .view-btn { padding: 7px 14px; border-radius: 0; border-right-width: 0; }
    #viewToggleGroup .view-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    #viewToggleGroup .view-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; border-right-width: 0.5px; }
    .view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .view-btn.active:hover { background: var(--accent); opacity: 0.9; }

    .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .toggle-btn.active:hover { background: var(--accent); opacity: 0.9; }

    .chart-container {
      /* Was overflow: hidden. That makes this an overflow-bearing ancestor
         of .table-scroll (which also sets overflow), and browsers disagree
         about which of two nested overflow ancestors a sticky descendant
         (.task-col/.task-label) should reference — Chromium picks
         .table-scroll (correct, it's the one that actually scrolls),
         Firefox/Gecko can lock onto this outer, non-scrolling one instead,
         which never fires the compensation and lets the frozen column drift
         with the content. overflow: clip still clips to the rounded corners
         below but doesn't register as a scroll container, so it's no longer
         a candidate — removes the ambiguity instead of guessing at it. */
      overflow: clip;
      border: 0.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      position: relative;
    }

    /* Thin scrollbar shown above the grid instead of below it, so it isn't
       right next to (and easily fat-fingered instead of) the Add task row.
       It has no visible content of its own — topScrollbarInner is sized in
       JS to match the table's actual scrollable width, and its scroll
       position is kept in sync with the real scroll container below. */
    .top-scrollbar {
      overflow-x: auto;
      overflow-y: hidden;
      height: 14px;
      border-bottom: 0.5px solid var(--border);
      border-radius: 12px 12px 0 0;
    }
    .top-scrollbar-inner { height: 1px; }

    .table-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      /* The real scrollbar lives in .top-scrollbar above; hide this one
         visually while keeping it scrollable (via scrollLeft sync and
         direct trackpad/shift-wheel scrolling on the grid itself). */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .table-scroll::-webkit-scrollbar { height: 0; display: none; }

    table { border-collapse: collapse; width: auto; }
    .table-wrap { position: relative; display: inline-block; min-width: 100%; }
    .task-col {
      width: 160px; min-width: 160px;
      /* Frozen first column: stays put while .table-scroll scrolls the date
         grid beneath it. z-index must clear the today-line (10) and end-zone
         (9) overlays plus bars (2)/muted overlays (1), all of which can
         otherwise slide underneath it during scroll; background must be
         opaque so that scrolled content doesn't show through. */
      position: sticky; left: 0; z-index: 15;
      background: var(--surface);
    }

    .date-header {
      font-size: 11px; color: var(--text-muted);
      text-align: center;
      padding: 3px 2px;
      border-bottom: 0.5px solid var(--border);
      border-right: 0.5px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }

    /* Portion of a fixed-width week/month column that falls outside the
       configured date range (before the start date or after the end date). */
    .col-muted {
      position: absolute; top: 0; bottom: 0;
      background-color: var(--bg);
      opacity: 0.6;
      background-image: repeating-linear-gradient(45deg, var(--border-strong) 0, var(--border-strong) 1px, transparent 1px, transparent 6px);
      pointer-events: none;
      z-index: 1;
    }

    .month-header {
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-align: left;
      padding: 3px 4px;
      border-bottom: 0.5px solid var(--border-strong);
      border-right: 0.5px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      background: var(--surface);
    }

    .month-header-label { position: sticky; left: 164px; }

    /* .date-header sets position:relative, and since it's declared after
       .task-col with equal specificity, it would otherwise win on the corner
       header cell (class="task-col date-header") and silently un-stick it.
       Pin it back down explicitly rather than relying on rule order. */
    .task-col.date-header { position: sticky; left: 0; }

    .date-header.weekend  { background: var(--surface-alt); }


    .task-label {
      padding: 6px 10px;
      border-bottom: 0.5px solid var(--border);
      border-right: 0.5px solid var(--border);
      font-size: 13px; color: var(--text);
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; max-width: 160px;
      /* Frozen first column, body rows — see .task-col for the full
         rationale; must match it (same left/z-index/opaque background) or
         the header and body columns would part ways while scrolling. */
      position: sticky; left: 0; z-index: 15;
      background: var(--surface);
    }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 14px; flex-shrink: 0;
      padding: 2px; border-radius: 4px;
      transition: color 0.1s, background 0.1s;
    }

    .drag-handle:hover  { color: var(--text); background: var(--surface-alt); }
    .drag-handle:active { cursor: grabbing; }

    .task-label input {
      background: transparent; border: none; outline: none;
      font-size: 13px; font-family: var(--font); color: var(--text);
      width: 100%; cursor: pointer; min-width: 0;
    }

    .task-label input:focus {
      background: var(--surface-alt);
      border-radius: 4px; padding: 1px 4px; cursor: text;
    }

    .color-dot {
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0; cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.1s;
    }

    .color-dot:hover { border-color: var(--border-strong); }

    .cell {
      border-bottom: 0.5px solid var(--border);
      border-right: 0.5px solid var(--border);
      height: 36px; position: relative;
    }

    .cell.weekend   { background: var(--surface-alt); }


    .bar {
      position: absolute; top: 6px; bottom: 6px;
      border-radius: 4px; cursor: grab;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; user-select: none;
      transition: opacity 0.1s; min-width: 6px; z-index: 2;
    }

    .bar:hover  { opacity: 0.85; }
    .bar:active { cursor: grabbing; }

    .resize-handle {
      position: absolute; top: 0; bottom: 0; width: 7px;
    }
    .resize-handle.left  { left: 0;  cursor: w-resize; }
    .resize-handle.right { right: 0; cursor: e-resize; }

    .bar-label {
      pointer-events: none; padding: 0 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; font-size: 11px; font-weight: 500; color: #fff;
    }

    .row-ghost td    { opacity: 0.4; background: var(--accent-bg) !important; }
    .row-drop-above td { border-top: 2px solid var(--accent) !important; }
    .row-drop-below td { border-bottom: 2px solid var(--accent) !important; }

    .add-row {
      padding: 7px 10px; font-size: 12px; color: var(--text-muted);
      cursor: pointer; border-top: 0.5px solid var(--border);
      display: flex; align-items: center; gap: 5px;
      border-radius: 0 0 12px 12px;
      transition: background 0.1s, color 0.1s;
    }

    .add-row:hover { background: var(--accent-bg); color: var(--accent); }

    .export-dropdown { position: relative; display: inline-flex; }

    .export-menu {
      position: fixed; z-index: 200; display: none;
      flex-direction: column; gap: 2px;
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 4px;
      min-width: 110px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    }
    .export-menu button {
      border: none; background: transparent;
      justify-content: flex-start; padding: 6px 10px; border-radius: 6px;
    }
    .export-menu button:hover { background: var(--surface-alt); }

    .color-picker-popup {
      position: fixed; z-index: 200;
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; width: 126px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    }

    .color-swatch {
      width: 22px; height: 22px; border-radius: 50%;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color 0.1s, transform 0.1s;
    }

    .color-swatch:hover  { transform: scale(1.15); }
    .color-swatch.active { border-color: var(--text); }

    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--bg);
      padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; z-index: 500;
      transition: opacity 0.4s; pointer-events: none;
    }

    footer { margin-top: 1.5rem; font-size: 12px; color: var(--text-muted); }

    /* Start/end/duration readout for whichever task row is currently
       hovered — see taskInfoBar in the JS below. Fixed height (rather than
       collapsing when empty) so the grid and footer don't jump vertically
       as the user moves the mouse on/off rows. */
    .task-info-bar {
      margin-top: 0.6rem;
      padding: 8px 14px;
      min-height: 34px;
      display: flex; align-items: center; gap: 1.5rem;
      font-size: 12px; color: var(--text-secondary);
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius);
    }
    .task-info-bar .info-name {
      font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 260px;
    }
    .task-info-bar .info-placeholder { color: var(--text-muted); }

    .date-field {
      display: inline-flex; align-items: center;
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface); color: var(--text);
      font-size: 13px; font-family: var(--font);
      padding: 7px 10px; gap: 6px; cursor: text;
      position: relative;
    }
    .date-field input[type="text"] {
      border: none; outline: none; background: transparent;
      font-size: 13px; font-family: var(--font); color: var(--text);
      width: 88px; cursor: text;
    }
    .date-field i { color: var(--text-muted); font-size: 14px; cursor: pointer; flex-shrink: 0; }
    .date-field i:hover { color: var(--text); }
    .date-field input[type="date"] {
      position: absolute; opacity: 0; width: 1px; height: 1px;
      top: 0; right: 0; pointer-events: none; border: none;
    }
    .date-field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24,95,165,0.15);
    }
  </style>
</head>

    <div class="date-field">
      <input type="text"  id="startDateText" placeholder="YYYY-MM-DD" maxlength="10" />
      <svg class="ti" id="startCalIcon" title="Pick date" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" /><path d="M16 3v4" /><path d="M8 3v4" /><path d="M4 11h16" /><path d="M11 15h1" /><path d="M12 15v3" /></svg>
      <input type="date"  id="startDate" tabindex="-1" />
    </div>
    <label class="tb" for="endDateText">End</label>
    <div class="date-field">
      <input type="text"  id="endDateText" placeholder="YYYY-MM-DD" maxlength="10" />
      <svg class="ti" id="endCalIcon" title="Pick date" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" /><path d="M16 3v4" /><path d="M8 3v4" /><path d="M4 11h16" /><path d="M11 15h1" /><path d="M12 15v3" /></svg>

  </div>
  <div class="toolbar-group" id="viewToggleGroup">
    <button id="btnDay"   onclick="setView('day')"   class="view-btn active">Day</button>

    <button id="btnMonth" onclick="setView('month')" class="view-btn">Month</button>
  </div>

    <button id="btnZoomOut" class="zoom-btn" onclick="zoomOut()" title="Zoom out">−</button>

  </div>
  <div class="toolbar-group">
    <button onclick="downloadJSON()"><svg class="ti" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg> Save JSON</button>

    <input type="file" id="fileInput" accept=".json" style="display:none" />

      Today line
    </button>

      <button id="btnExport" onclick="toggleExportMenu(event)"><svg class="ti" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8h.01" /><path d="M12.5 21h-6.5a3 3 0 0 1 -3 -3v-12a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v6.5" /><path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l4 4" /><path d="M14 14l1 -1c.653 -.629 1.413 -.815 2.13 -.559" /><path d="M19 16v6" /><path d="M22 19l-3 3l-3 -3" /></svg> Export <svg class="ti" aria-hidden="true" style="width:0.7em;height:0.7em;margin-left:-3px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6" /></svg></button>

<div class="chart-container" id="chartContainer">

        <tbody id="ganttBody"></tbody>

      <!-- Week mode's row-1 month labels/separators: positioned entirely by
           real calendar dates via dayToX (see render()'s WEEK/MONTH
           branch), independent of week-column edges. Populated in
           render(); hidden in day/month mode. -->
