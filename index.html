<script>
const COLORS      = ['#378ADD','#1D9E75','#D85A30','#D4537E','#7F77DD','#BA7517','#639922','#E24B4A','#888780'];
const COLOR_NAMES = ['Blue','Teal','Coral','Pink','Purple','Amber','Green','Red','Gray'];

let tasks = [
  { id:1, name:'Experiment 1',    start:0,  dur:5,  color:'#378ADD' },
  { id:2, name:'Experiment 2',      start:5,  dur:7,  color:'#1D9E75' },
  { id:3, name:'Symposium', start:10, dur:14, color:'#7F77DD' },
  { id:4, name:'Internship',     start:22, dur:6,  color:'#D85A30' },
  { id:5, name:'CR writeup', start:28, dur:3,  color:'#D4537E' },
];
let nextId      = 6;
let days        = 30;
let defaultDays = 30;  // restored when end date is cleared
let cellW       = 28;
// manualCellW: null = auto-fit (cellW derived from container width, the old
// default behavior); a number = user has zoomed, and that exact px width is
// used instead (clamped between the mode's label width and ZOOM_CELL_MAX)
// until they hit the fit-to-width button. Persists across view mode/date
// range changes and survives save/load — see effectiveCellW/syncCellW.
// Tracked separately per view mode (day/week/month): each view remembers
// its own zoom level, so switching views doesn't reclamp and overwrite
// whatever zoom you'd set in a different view.
let manualCellWByMode = { day: null, week: null, month: null };
const ZOOM_STEP     = 4;    // px added/removed per +/- click
const ZOOM_CELL_MAX = 400;  // sanity ceiling for the +/- buttons only, so repeated
                             // clicking can't produce absurdly fat columns. Fit-to-width
                             // is exempt — its whole point is filling the container
                             // exactly, however wide that needs to be (see zoomFit).
let weekMode    = false;  // true = each column represents 7 days
let monthMode   = false;  // true = each column represents one calendar month
let showTodayLine = true; // false = hide the today marker on screen and in PNG exports
let baseDate = new Date(); baseDate.setHours(0,0,0,0);
let endDate  = null;  // null = no deadline set

// ── Controls ───────────────────────────────────────────────────────────
const startDatePicker = document.getElementById('startDate');
const endDatePicker   = document.getElementById('endDate');
const startDateText   = document.getElementById('startDateText');
const endDateText     = document.getElementById('endDateText');

// Expose for legacy references in applyChartData
const startInput = { get value() { return startDateText.value; }, set value(v) { startDateText.value = v; startDatePicker.value = v; } };
const endInput   = { get value() { return endDateText.value;   }, set value(v) { endDateText.value   = v; endDatePicker.value   = v; } };

startDateText.value = fmtDate(baseDate);

function applyStartDate(val) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(val)) return;
  baseDate = new Date(val + 'T00:00:00');
  if (endDate) { const c = dayOffset(endDate) + 1; if (c > 0) days = c; }
  syncCellW(currentMode());
  render(); autoSave();
}
function applyEndDate(val) {
  endDate = val ? new Date(val + 'T00:00:00') : null;
  if (endDate) { const c = dayOffset(endDate) + 1; if (c > 0) days = c; }
  else days = defaultDays;
  syncCellW(currentMode());
  render(); autoSave();
}

startDateText.addEventListener('change', () => applyStartDate(startDateText.value));
startDateText.addEventListener('input',  () => { if (/^\d{4}-\d{2}-\d{2}$/.test(startDateText.value)) applyStartDate(startDateText.value); });
endDateText.addEventListener('change',   () => applyEndDate(endDateText.value));
endDateText.addEventListener('input',    () => { if (/^\d{4}-\d{2}-\d{2}$/.test(endDateText.value) || endDateText.value === '') applyEndDate(endDateText.value); });

// Calendar icon opens native picker; picker change syncs back to text input
document.getElementById('startCalIcon').addEventListener('click', () => {
  startDatePicker.showPicker ? startDatePicker.showPicker() : startDatePicker.click();
});
document.getElementById('endCalIcon').addEventListener('click', () => {
  endDatePicker.showPicker ? endDatePicker.showPicker() : endDatePicker.click();
});
startDatePicker.addEventListener('change', () => { startDateText.value = startDatePicker.value; applyStartDate(startDatePicker.value); });
endDatePicker.addEventListener('change',   () => { endDateText.value   = endDatePicker.value;   applyEndDate(endDatePicker.value);   });

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      applyChartData(JSON.parse(ev.target.result));
      showToast('Chart loaded');
    } catch { showToast('Could not read file'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ── Helpers ────────────────────────────────────────────────────────────
function addDays(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }

// ISO-8601 week number (1-53) for a given date. ISO weeks always start on
// Monday and week 1 is the week containing the year's first Thursday — this
// is the standard, unambiguous definition, so it stays correct across year
// boundaries and leap years without any special-casing here. Since our week
// columns are already Monday-anchored (getWeekCols), the ISO week number of
// a column's startDay is exactly the number that column represents.
function isoWeekNumber(d) {
  // Copy and normalize to UTC midnight to avoid DST-related off-by-ones.
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  // ISO weekday: Monday=1 .. Sunday=7
  const isoDow = date.getUTCDay() || 7;
  // Shift to the Thursday of this date's ISO week — the year that Thursday
  // falls in is the ISO week-numbering year, and its week is always week N.
  date.setUTCDate(date.getUTCDate() + 4 - isoDow);
  const isoYearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - isoYearStart) / 86400000) + 1) / 7);
}
function dayOffset(d) {
  // Use UTC midnight arithmetic to avoid DST shifts
  const a = Date.UTC(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
  const b = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b - a) / 86400000);
}
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const CELL_MAX  = 60;   // never grow a column wider than this even if the container is huge
const LABEL_PAD = 14;   // horizontal padding added around the widest label, in px
const LABEL_W   = 160;  // fixed width of the task-name column (matches .task-col CSS)

// ── Label width measurement ───────────────────────────────────────────────
// A column must always be at least as wide as its widest possible label.
// We measure with a scratch canvas so this works before anything is painted
// and stays exact regardless of what's currently on screen.
const _measureCanvas = document.createElement('canvas');
const _measureCtx    = _measureCanvas.getContext('2d');
function measureTextWidth(text, font) {
  _measureCtx.font = font;
  return _measureCtx.measureText(text).width;
}

const DATE_HEADER_FONT = '11px system-ui, -apple-system, "Segoe UI", sans-serif';

// Widest label a given view mode will ever need to render in a single column.
function labelMinWidth(mode) {
  if (mode === 'day') {
    // Day mode only labels Mondays with the day-of-month number (1–31).
    return measureTextWidth('30', DATE_HEADER_FONT) + LABEL_PAD;
  }
  if (mode === 'week') {
    // "Week NN" — worst case is the widest 2-digit week number, "Week 52".
    const label = 'Week 52';
    return measureTextWidth(label, DATE_HEADER_FONT) + LABEL_PAD;
  }
  // month mode: short month name, e.g. "Sep"
  let max = 0;
  for (let m = 0; m < 12; m++) {
    const label = new Date(2000, m, 1).toLocaleString('default', {month:'short'});
    max = Math.max(max, measureTextWidth(label, DATE_HEADER_FONT));
  }
  return max + LABEL_PAD;
}

// Number of data columns a mode currently needs, used only to decide how much
// of the available container width each fixed column is allowed to soak up.
function numColsFor(mode) {
  if (mode === 'day')   return days;
  if (mode === 'week')  return getWeekCols().length;
  return getMonthCols().length;
}

// The single source of truth for column width: never narrower than the
// widest label, never wider than CELL_MAX, otherwise stretched to fill
// the container. Every column in a given mode is exactly this width —
// there is no per-column scaling anywhere else in the app.
function computeCellW(mode) {
  const container = document.getElementById('chartContainer');
  const availW    = Math.max(0, container.clientWidth - LABEL_W);
  const n         = numColsFor(mode);
  const fitCell   = n > 0 ? Math.floor(availW / n) : 0;
  const minCell   = labelMinWidth(mode);
  return Math.min(CELL_MAX, Math.max(minCell, fitCell));
}

function currentMode() { return monthMode ? 'month' : weekMode ? 'week' : 'day'; }

// Resolves the width a column should actually render at: the auto-fit value
// from computeCellW() when no manual zoom is active, otherwise the user's
// chosen px width — reclamped to the *current* mode's label-width floor
// (switching e.g. Day -> Month can raise the floor). Not re-capped at
// ZOOM_CELL_MAX here: that ceiling only limits how far +/- can push the
// value (see zoomIn); a fit-to-width value is allowed to sit above it so
// "fit" can always mean the actual full container width.
// This is the only place that decides "auto or manual" — every call site
// that used to call computeCellW() directly now calls syncCellW() instead,
// so manual zoom stays in effect through view/date-range changes.
function effectiveCellW(mode) {
  const manual = manualCellWByMode[mode];
  if (manual == null) return computeCellW(mode);
  return Math.max(labelMinWidth(mode), manual);
}
function syncCellW(mode) { cellW = effectiveCellW(mode); }

function setView(mode) {
  weekMode  = mode === 'week';
  monthMode = mode === 'month';
  syncCellW(mode);

  document.getElementById('btnDay').classList.toggle('active',   mode === 'day');
  document.getElementById('btnWeek').classList.toggle('active',  mode === 'week');
  document.getElementById('btnMonth').classList.toggle('active', mode === 'month');

  render(); autoSave();
}

// Toggles the today marker for both the live grid (updateTodayLine) and
// PNG exports (exportPNG) — both read the same showTodayLine flag, so
// there's one source of truth for whether the line should be visible.
function toggleTodayLine() {
  showTodayLine = !showTodayLine;
  document.getElementById('btnTodayLine').classList.toggle('active', showTodayLine);
  updateTodayLine();
}

// ── Zoom ───────────────────────────────────────────────────────────────
// +/- nudge manualCellW by ZOOM_STEP; fit-to-width clears it back to null
// so computeCellW() takes over again. All three go through syncCellW() so
// the same clamping/mode-awareness applies as everywhere else cellW is set.
//
// The +/- ceiling is ZOOM_CELL_MAX *unless* the container is wide/columns
// are few enough that fit-to-width would need more than that to reach full
// width — in that case the ceiling is raised to match fitCellW(mode).
// Without this, ZOOM_CELL_MAX stayed a flat 400px even when fit-to-width
// (uncapped, see zoomFit) had already reached e.g. 445px: zooming out from
// there and then back in with "+" would climb only to 400 and stop, a dead
// zone between 400 and full width that was reachable by the fit button but
// not by "+". Tying the ceiling to fitCellW(mode) means "+" can always
// reach the same full width fit-to-width would give you.
function zoomInCeiling(mode) {
  return Math.max(ZOOM_CELL_MAX, fitCellW(mode));
}
function zoomIn() {
  const mode = currentMode();
  const base = manualCellWByMode[mode] != null ? manualCellWByMode[mode] : cellW;
  const ceiling = zoomInCeiling(mode);
  // Guard against ever snapping base *down*, in case base somehow already
  // exceeds ceiling (shouldn't happen now that ceiling accounts for fit,
  // but kept defensive — the button is disabled in that state anyway).
  manualCellWByMode[mode] = Math.max(base, Math.min(ceiling, base + ZOOM_STEP));
  syncCellW(mode);
  render(); autoSave();
}
function zoomOut() {
  const mode = currentMode();
  const base = manualCellWByMode[mode] != null ? manualCellWByMode[mode] : cellW;
  manualCellWByMode[mode] = Math.max(labelMinWidth(mode), base - ZOOM_STEP);
  syncCellW(mode);
  render(); autoSave();
}
// Width that exactly fills the container at the current column count — unlike
// computeCellW(), this deliberately ignores CELL_MAX. CELL_MAX exists so
// *automatic* fitting doesn't stretch columns to some huge default width;
// but the fit-to-width button's entire purpose is filling the container on
// request, so it must be allowed past that ceiling (still floored at
// labelMinWidth so header labels stay legible).
function fitCellW(mode) {
  const container = document.getElementById('chartContainer');
  const availW    = Math.max(0, container.clientWidth - LABEL_W);
  const n         = numColsFor(mode);
  const minCell   = labelMinWidth(mode);
  const fitCell   = n > 0 ? Math.floor(availW / n) : minCell;
  return Math.max(minCell, fitCell);
}

function zoomFit() {
  const mode = currentMode();
  if (!fitsWithinContainer(mode)) return; // button is disabled in this case anyway
  // fitCellW() deliberately ignores CELL_MAX (see its comment) so it can
  // reach true full width. It's also not clamped to ZOOM_CELL_MAX here —
  // that ceiling exists only to stop +/- clicks from producing absurdly
  // fat columns; fit-to-width's entire point is filling the container on
  // request, however wide that turns out to be. effectiveCellW() no longer
  // re-caps this either, so the stored value and the displayed width always
  // agree (see effectiveCellW's comment for why that matters).
  manualCellWByMode[mode] = fitCellW(mode);
  syncCellW(mode);
  render(); autoSave();
}
// Whether the chart's columns can all fit within the container at the
// mode's *smallest* allowed column width (labelMinWidth) — i.e. whether
// "fit to width" can actually eliminate horizontal scrolling. If even the
// minimum zoom doesn't fit, there's no width fit() could produce that both
// (a) fits the container and (b) is wide enough to fit every column's
// label, so the button has nothing meaningful to do.
function fitsWithinContainer(mode) {
  const container = document.getElementById('chartContainer');
  const availW     = Math.max(0, container.clientWidth - LABEL_W);
  const n          = numColsFor(mode);
  const minCell    = labelMinWidth(mode);
  return n === 0 || n * minCell <= availW;
}

// Disable +/- once further zoom would have no effect (already at the
// mode's label-width floor or its zoomInCeiling). Disable fit-to-width
// (and explain why via the tooltip) when the chart can't fit even at the
// smallest allowed column width.
function updateZoomButtons() {
  const mode = currentMode();
  const min  = labelMinWidth(mode);
  const val  = manualCellWByMode[mode] != null ? manualCellWByMode[mode] : cellW;
  document.getElementById('btnZoomOut').disabled = val <= min;
  document.getElementById('btnZoomIn').disabled  = val >= zoomInCeiling(mode);

  const fitBtn = document.getElementById('btnZoomFit');
  const canFit = fitsWithinContainer(mode);
  fitBtn.disabled = !canFit;
  fitBtn.title = canFit
    ? 'Fit to width (no horizontal scroll)'
    : 'Chart is too large to fit in this view';
}

// Recompute the fixed column width for the active view when the window
// resizes (columns stay uniform; they just grow/shrink together).
let _resizeRAF = null;
window.addEventListener('resize', () => {
  if (_resizeRAF) cancelAnimationFrame(_resizeRAF);
  _resizeRAF = requestAnimationFrame(() => {
    // Manual zoom is an absolute px width, so it's unaffected by container
    // size (that's the whole point) — this recompute only changes anything
    // when auto-fit is active.
    syncCellW(currentMode());
    render();
  });
});


// ── Render ─────────────────────────────────────────────────────────────
// Returns HTML for the muted overlay covering the portion of a fixed-width
// week/month column that falls outside [0, days) — i.e. before baseDate or
// after the configured end date. Every column is rendered at the same
// `cellW`, so this is purely cosmetic and never affects layout math.
function _mutedOverlayHTML(c) {
  let html = '';
  const leadDays = Math.max(0, Math.min(c.fullSpan, -c.startDay));
  if (leadDays > 0) {
    const w = (leadDays / c.fullSpan) * cellW;
    html += `<div class="col-muted" style="left:0;width:${w}px;"></div>`;
  }
  const trailDays = Math.max(0, (c.startDay + c.fullSpan) - days);
  if (trailDays > 0) {
    const w = (Math.min(trailDays, c.fullSpan) / c.fullSpan) * cellW;
    html += `<div class="col-muted" style="right:0;width:${w}px;"></div>`;
  }
  return html;
}

function render() {
  // Monday anchor: find the Monday on or before baseDate
  const baseDow        = baseDate.getDay(); // 0=Sun,1=Mon,...,6=Sat
  const daysToMonday   = baseDow === 0 ? -6 : 1 - baseDow; // offset to prev/current Monday
  // labelAnchor is the offset from day 0 of the first Monday label
  // (may be negative if baseDate is not Monday, meaning first label is before the grid)
  const mondayAnchor   = daysToMonday; // ≤ 0

  if (!weekMode && !monthMode) {
    // ── DAY MODE ─────────────────────────────────────────────────────────
    // Every column is exactly one day and exactly `cellW` wide — no scaling.
    document.getElementById('monthSepOverlay').style.display = 'none';

    // Header row 1: month spans
    const head = document.getElementById('ganttHead');
    const monthSpans = [];
    for (let i = 0; i < days; i++) {
      const d   = addDays(baseDate, i);
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      if (!monthSpans.length || monthSpans[monthSpans.length-1].key !== key)
        monthSpans.push({ key, label: d.toLocaleString('default', {month:'short', year:'numeric'}), count: 1 });
      else monthSpans[monthSpans.length-1].count++;
    }
    let row1 = `<tr><th class="task-col month-header" style="text-align:left;padding:3px 10px;color:var(--text-secondary);font-size:12px;font-weight:500;">Task</th>`;
    for (const ms of monthSpans) {
      const w = ms.count * cellW;
      row1 += `<th class="month-header" colspan="${ms.count}" style="min-width:${w}px;max-width:${w}px;"><span class="month-header-label">${ms.label}</span></th>`;
    }
    row1 += '</tr>';

    // Header row 2: day numbers, labelled on Mondays only (deliberately sparse)
    let row2 = `<tr><th class="task-col date-header" style="border-right:0.5px solid var(--border-strong);"></th>`;
    for (let i = 0; i < days; i++) {
      const d      = addDays(baseDate, i);
      const isWE   = d.getDay()===0||d.getDay()===6;
      const offsetFromMonday = i - mondayAnchor;
      const show = offsetFromMonday % 7 === 0;
      let cls = 'date-header';
      if (isWE)   cls += ' weekend';
      row2 += `<th class="${cls}" style="width:${cellW}px;min-width:${cellW}px;">${show ? d.getDate() : ''}</th>`;
    }
    row2 += '</tr>';
    head.innerHTML = row1 + row2;

    // Body: one cell per day
    const body = document.getElementById('ganttBody');
    body.innerHTML = '';
    tasks.forEach(task => {
      const tr = document.createElement('tr');
      tr.dataset.id = task.id;
      tr.appendChild(_makeLabelTd(task));

      for (let i = 0; i < days; i++) {
        const d      = addDays(baseDate, i);
        const isWE   = d.getDay()===0||d.getDay()===6;
        const td     = document.createElement('td');
        let cls = 'cell';
        if (isWE)   cls += ' weekend';
        td.className      = cls;
        td.style.cssText  = `width:${cellW}px;min-width:${cellW}px;`;
        td.dataset.day    = i;
        td.dataset.taskId = task.id;
        tr.appendChild(td);
      }
      body.appendChild(tr);
      _placeBarUnified(tr, task, days);
    });

  } else {
    // ── WEEK / MONTH MODE ─────────────────────────────────────────────────
    // Every column is a full calendar week or month and exactly `cellW`
    // wide. Columns at the edges may extend before day 0 or past `days`;
    // that portion is rendered muted rather than shrinking the column.
    const cols    = monthMode ? getMonthCols() : getWeekCols();
    const numCols = cols.length;

    // Header row 1: month/year labels.
    //
    // Month mode: unaffected — its columns ARE calendar months, so grouping
    // by colspan is already exact (a full calendar month column never spans
    // two years, so year-grouping by start day is safe).
    //
    // Week mode: NOT grouped by colspan at all anymore. Three earlier
    // attempts (start-day grouping, majority-of-days grouping, an added
    // exact-line overlay, suppressing/restoring various borders — see
    // project notes for the full history) all failed because they tried to
    // reconcile two things that can't be reconciled inside a colspan model:
    // a label naming ONE month for a WHOLE week-column, and a boundary that
    // needs to fall on the TRUE calendar date, which is essentially never a
    // week-column edge. Grouping by colspan — by ANY rule — guarantees every
    // visible "month starts" exactly at a week boundary, never on the real
    // date, which is exactly what was flagged as wrong.
    //
    // Fixed by not grouping into per-month `<th>` cells at all. Row 1 is a
    // single `<th colspan=numCols>` with no text; a label span
    // (dayToX-centered on that month's own true date range) and a boundary
    // line (dayToX-positioned on the true transition day) are drawn as an
    // absolutely-positioned overlay afterward — both computed independently
    // of week-column edges, so neither can drift from the real calendar.
    const head = document.getElementById('ganttHead');
    let row1;
    if (monthMode) {
      const groupSpans = [];
      for (let ci = 0; ci < numCols; ci++) {
        const d   = addDays(baseDate, cols[ci].startDay);
        const key = `${d.getFullYear()}`;
        if (!groupSpans.length || groupSpans[groupSpans.length-1].key !== key)
          groupSpans.push({ key, label: key, colCount: 1 });
        else groupSpans[groupSpans.length-1].colCount++;
      }
      row1 = `<tr><th class="task-col month-header" style="text-align:left;padding:3px 10px;color:var(--text-secondary);font-size:12px;font-weight:500;">Task</th>`;
      for (const gs of groupSpans) {
        const w = gs.colCount * cellW;
        row1 += `<th class="month-header" colspan="${gs.colCount}" style="min-width:${w}px;max-width:${w}px;"><span class="month-header-label">${gs.label}</span></th>`;
      }
      row1 += '</tr>';
    } else {
      const w = numCols * cellW;
      row1 = `<tr><th class="task-col month-header" style="text-align:left;padding:3px 10px;color:var(--text-secondary);font-size:12px;font-weight:500;">Task</th>`
           + `<th class="month-header" colspan="${numCols}" style="min-width:${w}px;max-width:${w}px;border-right:none;"></th></tr>`;
    }

    // Header row 2: week number ("Week 24") or month name ("Jun")
    let row2 = `<tr><th class="task-col date-header" style="border-right:0.5px solid var(--border-strong);"></th>`;
    for (let ci = 0; ci < numCols; ci++) {
      const c    = cols[ci];
      const d    = addDays(baseDate, c.startDay);
      let cls = 'date-header';
      const label = monthMode
        ? d.toLocaleString('default', {month:'short'})
        : `Week ${isoWeekNumber(d)}`;
      row2 += `<th class="${cls}" style="width:${cellW}px;min-width:${cellW}px;">${label}${_mutedOverlayHTML(c)}</th>`;
    }
    row2 += '</tr>';
    head.innerHTML = row1 + row2;

    // Week mode's exact month labels/lines (see comment above row1's
    // construction). Segments are computed purely from real calendar dates
    // — entirely independent of where week-column edges happen to fall —
    // so a month's true date range decides both where its label is centered
    // and where the boundary line before it is drawn.
    const monthSepOverlay = document.getElementById('monthSepOverlay');
    if (weekMode) {
      const gridStart = cols[0].startDay;
      const gridEnd   = cols[cols.length - 1].startDay + cols[cols.length - 1].fullSpan;
      const segments  = [];
      let segStart = gridStart;
      for (let off = gridStart + 1; off < gridEnd; off++) {
        if (addDays(baseDate, off).getDate() === 1) { segments.push({ start: segStart, end: off }); segStart = off; }
      }
      segments.push({ start: segStart, end: gridEnd });

      const MIN_LABEL_PX = 34; // skip labels too narrow to plausibly show text, rather than let them overlap neighbors
      const parts = [];
      segments.forEach((seg, i) => {
        if (i > 0) {
          const x = LABEL_W + dayToX(seg.start);
          parts.push(`<div style="position:absolute;top:0;bottom:0;left:${x}px;width:1px;background:var(--border-strong);"></div>`);
        }
        const widthPx = dayToX(seg.end) - dayToX(seg.start);
        if (widthPx >= MIN_LABEL_PX) {
          const cx    = LABEL_W + dayToX((seg.start + seg.end) / 2);
          const label = addDays(baseDate, seg.start).toLocaleString('default', {month:'short', year:'numeric'});
          parts.push(`<div style="position:absolute;top:0;bottom:0;left:${cx}px;transform:translateX(-50%);display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--text-secondary);white-space:nowrap;">${label}</div>`);
        }
      });
      monthSepOverlay.innerHTML = parts.join('');
      monthSepOverlay.style.height  = head.rows[0].offsetHeight + 'px';
      monthSepOverlay.style.display = 'block';
    } else {
      monthSepOverlay.style.display = 'none';
      monthSepOverlay.innerHTML = '';
    }

    // Body: one cell per column
    const body = document.getElementById('ganttBody');
    body.innerHTML = '';
    tasks.forEach(task => {
      const tr = document.createElement('tr');
      tr.dataset.id = task.id;
      tr.appendChild(_makeLabelTd(task));

      for (let ci = 0; ci < numCols; ci++) {
        const c    = cols[ci];
        const td   = document.createElement('td');
        let cls = 'cell';
        td.className     = cls;
        td.style.cssText = `width:${cellW}px;min-width:${cellW}px;`;
        td.dataset.taskId = task.id;
        td.insertAdjacentHTML('beforeend', _mutedOverlayHTML(c));
        tr.appendChild(td);
      }
      body.appendChild(tr);
      _placeBarUnified(tr, task, days);
    });
  }
  updateEndZone();
  updateTodayLine();
  syncTopScrollbarWidth();
  updateZoomButtons();
}

// ── Top scrollbar (mirrors the grid's real horizontal scroll) ─────────────
// The grid's own scrollbar is hidden; this thin bar above the header is the
// only one the user sees/drags, keeping it away from the Add task row below
// the grid. Width is resynced after every render since column count/cellW
// (and therefore total scrollable width) can change with the view, zoom,
// or date range.
const topScrollbar      = document.getElementById('topScrollbar');
const topScrollbarInner = document.getElementById('topScrollbarInner');
const tableScroll       = document.getElementById('tableScroll');
function syncTopScrollbarWidth() {
  topScrollbarInner.style.width = tableScroll.scrollWidth + 'px';
}
let _syncingScroll = false;
topScrollbar.addEventListener('scroll', () => {
  if (_syncingScroll) return;
  _syncingScroll = true;
  tableScroll.scrollLeft = topScrollbar.scrollLeft;
  _syncingScroll = false;
});
tableScroll.addEventListener('scroll', () => {
  if (_syncingScroll) return;
  _syncingScroll = true;
  topScrollbar.scrollLeft = tableScroll.scrollLeft;
  _syncingScroll = false;
});

// ── End-date boundary zone ───────────────────────────────────────────────
// Shades everything past the end date, computed directly from dayToX — the
// same function that positions every column and bar — so it can never
// drift out of sync with what's on screen.
function updateEndZone() {
  const zone = document.getElementById('endZone');
  if (!zone) return;
  if (!endDate) { zone.style.display = 'none'; return; }

  const numCols = monthMode ? getMonthCols().length : weekMode ? getWeekCols().length : days;
  const tableRightPx = LABEL_W + numCols * cellW;
  const leftPx = LABEL_W + dayToX(days);
  const zoneWidth = tableRightPx - leftPx;

  if (zoneWidth > 1) {
    zone.style.display = 'block';
    zone.style.left    = leftPx + 'px';
    zone.style.width   = zoneWidth + 'px';
    zone.style.right   = '';
  } else {
    zone.style.display = 'none';
  }
}

// ── Today marker ─────────────────────────────────────────────────────────
// A thin vertical line through the middle of today's day, computed from
// dayToX like everything else (so it's pixel-consistent with the columns
// and bars around it), instead of shading the whole column.
function gridDayBounds() {
  if (!weekMode && !monthMode) return { start: 0, end: days };
  const cols = monthMode ? getMonthCols() : getWeekCols();
  if (!cols.length) return { start: 0, end: days };
  const last = cols[cols.length - 1];
  return { start: cols[0].startDay, end: last.startDay + last.fullSpan };
}
function updateTodayLine() {
  const line = document.getElementById('todayLine');
  if (!line) return;

  if (!showTodayLine) { line.style.display = 'none'; return; }

  const today    = new Date(); today.setHours(0,0,0,0);
  const todayOff = dayOffset(today);
  const bounds   = gridDayBounds();

  if (todayOff < bounds.start || todayOff >= bounds.end) {
    line.style.display = 'none';
    return;
  }

  const centerPx = LABEL_W + (dayToX(todayOff) + dayToX(todayOff + 1)) / 2;
  line.style.display = 'block';
  line.style.left    = centerPx + 'px';
}
function _makeLabelTd(task) {
  const labelTd = document.createElement('td');
  labelTd.className = 'task-label';

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.dataset.id = task.id;
  handle.setAttribute('aria-label', 'Drag to reorder');
  handle.innerHTML = '<svg class="ti" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M8 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M8 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M14 5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M14 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M14 19a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg>';

  const dot = document.createElement('div');
  dot.className = 'color-dot';
  dot.style.background = task.color;
  dot.dataset.id = task.id;
  dot.title = 'Change color';

  const nameInput = document.createElement('input');
  nameInput.value = task.name;
  nameInput.dataset.id = task.id;
  nameInput.title = 'Click to rename';

  labelTd.appendChild(handle);
  labelTd.appendChild(dot);
  labelTd.appendChild(nameInput);

  // Rename
  nameInput.addEventListener('change', e => {
    const t = tasks.find(x=>x.id===+e.target.dataset.id);
    if (t) { t.name=e.target.value; render(); autoSave(); }
  });
  // Color
  dot.addEventListener('click', e => {
    e.stopPropagation(); showColorPicker(task.id, e.currentTarget);
  });
  // Delete
  labelTd.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (tasks.length>1 && confirm(`Delete "${task.name}"?`)) {
      tasks=tasks.filter(x=>x.id!==task.id); render(); autoSave();
    }
  });
  return labelTd;
}

// ── Bar placement helpers ───────────────────────────────────────────────────
function _makeBar(task, spanCols, extraPx) {
  const bar = document.createElement('div');
  bar.className  = 'bar';
  bar.dataset.id = task.id;
  bar.style.cssText = `background:${task.color};left:0;width:calc(${spanCols*100}% + ${extraPx}px);`;
  const lh = document.createElement('div');
  lh.className='resize-handle left'; lh.dataset.id=task.id; lh.dataset.action='left';
  const bl = document.createElement('span');
  bl.className='bar-label'; bl.textContent=task.name;
  const rh = document.createElement('div');
  rh.className='resize-handle right'; rh.dataset.id=task.id; rh.dataset.action='right';
  bar.appendChild(lh); bar.appendChild(bl); bar.appendChild(rh);
  return bar;
}

// Unified bar placement for all three view modes. Bar edges are found with
// dayToX (the same function that positions every header/cell), so a bar's
// pixels always agree exactly with the columns it's drawn on top of —
// there is no separate/duplicated geometry to drift out of sync.
function _placeBarUnified(tr, task, totalDays) {
  const barStart = Math.max(0, task.start);
  const barEnd   = Math.min(totalDays, task.start + task.dur);
  if (barStart >= totalDays || barEnd <= 0) return;

  const leftAbs  = dayToX(barStart);
  const rightAbs = dayToX(barEnd);
  const startCol = colIndexForDay(barStart);
  const startCell = tr.cells[startCol + 1];
  if (!startCell) return;

  const leftPx  = leftAbs - startCol * cellW;
  const widthPx = rightAbs - leftAbs;

  const bar = _makeBar(task, 0, 0);
  bar.style.cssText = `background:${task.color};left:${leftPx}px;width:${Math.max(2, widthPx - 1)}px;`;
  startCell.appendChild(bar);

  // Only show a hover tooltip when the label is actually clipped by the
  // bar's width — scrollWidth/clientWidth only reflect real layout once
  // the element is in the live DOM, which it now is (appended above).
  // Note: the tooltip has to go on `bar`, not `bl` — .bar-label has
  // pointer-events:none (so drags pass through to the bar underneath),
  // which also means the label itself never receives the hover events
  // a native title tooltip depends on.
  const bl = bar.querySelector('.bar-label');
  if (bl.scrollWidth > bl.clientWidth) bar.title = task.name;
}

// ── Task hover info (start / end / duration, shown below the grid) ─────────
const taskInfoBar = document.getElementById('taskInfoBar');
let hoveredTaskId = null;

function showTaskInfo(task) {
  const start = addDays(baseDate, task.start);
  const end   = addDays(baseDate, task.start + task.dur - 1); // inclusive last day
  taskInfoBar.innerHTML = '';
  const nameEl = document.createElement('span');
  nameEl.className   = 'info-name';
  nameEl.textContent = task.name; // textContent, not innerHTML — task names are user input
  taskInfoBar.appendChild(nameEl);
  [
    `Start: ${fmtDate(start)}`,
    `End: ${fmtDate(end)}`,
    `Duration: ${task.dur} day${task.dur === 1 ? '' : 's'}`,
  ].forEach(text => {
    const s = document.createElement('span');
    s.textContent = text;
    taskInfoBar.appendChild(s);
  });
}

function clearTaskInfo() {
  taskInfoBar.innerHTML = '<span class="info-placeholder">Hover a task to see its start, end, and duration</span>';
}

// Delegated on the (stable) tbody element rather than individual rows, so
// this one-time listener survives render()'s full tbody.innerHTML rebuilds.
document.getElementById('ganttBody').addEventListener('mouseover', e => {
  const row = e.target.closest('tr[data-id]');
  if (!row) return;
  const id = +row.dataset.id;
  if (id === hoveredTaskId) return; // already showing this row, avoid redundant rebuild
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  hoveredTaskId = id;
  showTaskInfo(task);
});

document.getElementById('ganttBody').addEventListener('mouseout', e => {
  const row = e.target.closest('tr[data-id]');
  if (!row) return;
  // mouseout also fires when moving between two child cells of the same
  // row — only actually clear once the pointer leaves the row itself.
  if (row.contains(e.relatedTarget)) return;
  hoveredTaskId = null;
  clearTaskInfo();
});

// ── Bar drag & resize (delegated) ─────────────────────────────────────────
let dragState = null;

// One-time delegated mousedown on the table covers both bars and cells
document.getElementById('ganttTable').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const bar  = e.target.closest('.bar');
  const cell = e.target.closest('.cell');
  if (bar) {
    onBarMousedown(e, bar);
  } else if (cell) {
    onCellMousedown(e, cell);
  }
});

// Left edge of the day-0 column, in viewport pixels. This is the only DOM
// measurement drag/click math needs — it's a fixed structural offset, not
// per-column geometry, so it can't drift the way the old per-day-width
// approach could.
function gridLeftPx() {
  const wrap = document.querySelector('.table-wrap');
  return wrap.getBoundingClientRect().left + LABEL_W;
}

function onBarMousedown(e, bar) {
  const action = e.target.dataset.action;
  const id     = +(bar.dataset.id);
  const task   = tasks.find(t=>t.id===id);
  if (!task) return;
  const startDay = xToDay(e.clientX - gridLeftPx());
  dragState = action
    ? {type:'resize',action,task,startDay,origStart:task.start,origDur:task.dur}
    : {type:'move',  task,   startDay,origStart:task.start,origDur:task.dur};
  e.preventDefault(); e.stopPropagation();
}

function onCellMousedown(e, cell) {
  const taskId = +cell.dataset.taskId;
  const task   = tasks.find(t=>t.id===taskId);
  if (!task) return;

  const day = xToDay(e.clientX - gridLeftPx());

  if (day<task.start||day>=task.start+task.dur) {
    dragState={type:'move',task,startDay:day,origStart:task.start,origDur:task.dur};
    e.preventDefault();
  }
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  // Always resolve the day directly under the cursor right now (an absolute
  // lookup via xToDay), rather than accumulating a pixel delta through a
  // per-day width that can silently change mid-drag (e.g. when a task
  // crosses from a 31-day month into a 28-day one). This keeps the bar
  // perfectly tracking the cursor with no snapping.
  const dayNow = xToDay(e.clientX - gridLeftPx());
  const delta  = dayNow - dragState.startDay;
  const {task,origStart,origDur,type,action} = dragState;
  // `days` equals dayOffset(endDate)+1 when an end date is set, so clamping
  // start+dur to <= days enforces the red-line boundary in all three modes.
  if (type==='move') {
    task.start = Math.max(0, Math.min(origStart + delta, days - origDur));
  } else if (action==='left') {
    const ns = Math.max(0, Math.min(origStart + origDur - 1, origStart + delta));
    task.start = ns;
    task.dur   = Math.max(1, origDur - (ns - origStart));
  } else {
    task.dur = Math.max(1, Math.min(origDur + delta, days - origStart));
  }
  updateBarInPlace(task);
});

// Lightweight bar repositioning during drag — avoids full DOM rebuild and reflow jumps
function updateBarInPlace(task) {
  // Move the bar element to the correct cell without rebuilding the whole table
  const tbody = document.getElementById('ganttBody');
  const row   = tbody.querySelector(`tr[data-id="${task.id}"]`);
  if (!row) return;

  // Remove existing bar
  const existingBar = row.querySelector('.bar');
  if (existingBar) existingBar.remove();

  _placeBarUnified(row, task, days);

  // Keep the hover info bar live while dragging/resizing this task — without
  // this it would show stale dates until the mouse re-enters the row.
  if (hoveredTaskId === task.id) showTaskInfo(task);
}

// Recompute week columns for the current baseDate/days (mirrors the logic in render())
// Every column is a *complete* calendar week (Mon–Sun), so its pixel width
// is always exactly `cellW`. The grid starts on the Monday on/before
// baseDate (startDay may be negative) and ends once it has covered the
// last visible day. Any days of the first/last column that fall outside
// [0, days) are simply rendered muted — see render()'s out-of-range overlay.
function getWeekCols() {
  const dow      = baseDate.getDay(); // 0=Sun..6=Sat
  const toMonday = dow === 0 ? -6 : -(dow - 1); // ≤ 0 offset of the Monday on/before baseDate
  const weekCols = [];
  let d0 = toMonday;
  while (d0 < days) {
    weekCols.push({ startDay: d0, fullSpan: 7 });
    d0 += 7;
  }
  return weekCols;
}

// Every column is a *complete* calendar month. The grid starts on the 1st
// of the month on/before baseDate (startDay may be negative). Portions of
// the first/last column outside [0, days) are rendered muted.
function getMonthCols() {
  const firstOfMonth = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
  const monthCols = [];
  let d0 = dayOffset(firstOfMonth); // ≤ 0
  while (d0 < days) {
    const d        = addDays(baseDate, d0);
    const daysInMo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    monthCols.push({ startDay: d0, fullSpan: daysInMo, daysInMonth: daysInMo });
    d0 += daysInMo;
  }
  return monthCols;
}

// ── Canonical day-offset ⇄ pixel conversion ───────────────────────────────
// Every column (day, week, or month) is exactly `cellW` wide, so column i
// occupies pixels [i*cellW, (i+1)*cellW). Within a week/month column, a day
// offset maps to a fraction of that column's fullSpan. This pair of
// functions is the ONLY place day/pixel math happens — headers, cells,
// bars, the end-date line, and dragging all call through here so nothing
// can drift out of sync with anything else.
function dayToX(offset) {
  if (!weekMode && !monthMode) return offset * cellW;
  const cols = monthMode ? getMonthCols() : getWeekCols();
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    if (offset < c.startDay + c.fullSpan || i === cols.length - 1) {
      return i * cellW + ((offset - c.startDay) / c.fullSpan) * cellW;
    }
  }
  return cols.length * cellW;
}
function xToDay(px) {
  if (!weekMode && !monthMode) return Math.floor(px / cellW);
  const cols = monthMode ? getMonthCols() : getWeekCols();
  if (!cols.length) return 0;
  let idx = Math.max(0, Math.min(cols.length - 1, Math.floor(px / cellW)));
  const c = cols[idx];
  const frac = (px - idx * cellW) / cellW;
  return Math.floor(c.startDay + frac * c.fullSpan);
}
// Which data-column index (0-based, matching tr.cells[i+1]) a day offset falls in.
function colIndexForDay(offset) {
  if (!weekMode && !monthMode) return offset;
  const cols = monthMode ? getMonthCols() : getWeekCols();
  for (let i = 0; i < cols.length; i++) {
    if (offset < cols[i].startDay + cols[i].fullSpan) return i;
  }
  return Math.max(0, cols.length - 1);
}

// Returns the active column set + per-column "full span" divisor (7 for
// week mode, the calendar month's day count for month mode) so bar-placement
// math can be shared between the two zoomed-out modes.
function getActiveCols() {
  if (monthMode) return { cols: getMonthCols(), kind: 'month' };
  if (weekMode)  return { cols: getWeekCols(),  kind: 'week'  };
  return null;
}

document.addEventListener('mouseup', () => { if (dragState) { dragState=null; render(); autoSave(); } });

// ── Vertical row reorder (delegated) ──────────────────────────────────────
let rowDrag = null;

document.getElementById('ganttBody').addEventListener('mousedown', e => {
  const handle = e.target.closest('.drag-handle');
  if (!handle || e.button !== 0) return;
  const id = +handle.dataset.id;
  const tr = handle.closest('tr');
  rowDrag  = {id, tr, startY:e.clientY, dragging:false, overIndex:null, dropBefore:true};
  e.preventDefault(); e.stopPropagation();
});

document.addEventListener('mousemove', e => {
  if (!rowDrag) return;
  if (!rowDrag.dragging && Math.abs(e.clientY-rowDrag.startY)>4) {
    rowDrag.dragging = true;
    rowDrag.tr.classList.add('row-ghost');
    document.body.style.cursor = 'grabbing';
  }
  if (!rowDrag.dragging) return;

  const rows = Array.from(document.querySelectorAll('#ganttBody tr'));
  rows.forEach(r => r.classList.remove('row-drop-above','row-drop-below'));
  rowDrag.overIndex = null;

  for (let i=0; i<rows.length; i++) {
    const rect = rows[i].getBoundingClientRect();
    if (e.clientY>=rect.top && e.clientY<=rect.bottom && rows[i]!==rowDrag.tr) {
      const before = e.clientY < rect.top + rect.height/2;
      rows[i].classList.add(before ? 'row-drop-above' : 'row-drop-below');
      rowDrag.overIndex  = i;
      rowDrag.dropBefore = before;
      break;
    }
  }
});

document.addEventListener('mouseup', () => {
  if (!rowDrag) return;
  document.body.style.cursor = '';
  document.querySelectorAll('#ganttBody tr').forEach(r =>
    r.classList.remove('row-ghost','row-drop-above','row-drop-below')
  );
  if (rowDrag.dragging && rowDrag.overIndex !== null) {
    const srcIdx  = tasks.findIndex(t=>t.id===rowDrag.id);
    const [moved] = tasks.splice(srcIdx,1);
    let dest = rowDrag.overIndex;
    if (!rowDrag.dropBefore) dest++;
    if (srcIdx < rowDrag.overIndex) dest--;
    tasks.splice(Math.max(0,Math.min(tasks.length,dest)),0,moved);
    autoSave();
  }
  rowDrag = null;
  render();
});

// ── Add task ───────────────────────────────────────────────────────────
function addTask() {
  const last   = tasks.slice(-1)[0];
  const limit  = days - 3;
  const start  = last ? Math.min(last.start+last.dur, limit) : 0;
  const dur    = endDate ? Math.min(5, days - start) : 5;
  tasks.push({id:nextId++, name:'New task', start: Math.max(0, start), dur: Math.max(1, dur), color:COLORS[tasks.length%COLORS.length]});
  render(); autoSave();
}

// ── Color picker ───────────────────────────────────────────────────────
let colorTarget = null;

function showColorPicker(taskId, anchor) {
  colorTarget = taskId;
  const picker = document.getElementById('colorPicker');
  const task   = tasks.find(x=>x.id===taskId);
  picker.innerHTML = COLORS.map((c,i) =>
    `<div class="color-swatch${task&&task.color===c?' active':''}" style="background:${c}" title="${COLOR_NAMES[i]}" data-color="${c}"></div>`
  ).join('');
  picker.querySelectorAll('.color-swatch').forEach(s => {
    s.addEventListener('click', () => {
      const t=tasks.find(x=>x.id===colorTarget);
      if (t) t.color=s.dataset.color;
      picker.style.display='none'; render(); autoSave();
    });
  });
  const rect = anchor.getBoundingClientRect();
  picker.style.cssText=`display:flex;top:${rect.bottom+4+window.scrollY}px;left:${rect.left+window.scrollX}px;`;
}

document.addEventListener('click', e => {
  if (!e.target.closest('.color-picker-popup')&&!e.target.closest('.color-dot'))
    document.getElementById('colorPicker').style.display='none';
});

// ── Chart data helpers ─────────────────────────────────────────────────
function chartData() {
  // `zoom` is the manual override per view mode (or null for auto-fit),
  // kept separate from `cellW`, which stays a derived/display-only value,
  // never persisted as authoritative (see note in applyChartData).
  return { version:1, baseDate:fmtDate(baseDate), endDate: endDate ? fmtDate(endDate) : null, days: defaultDays, cellW, zoom: manualCellWByMode, tasks };
}

function applyChartData(data) {
  tasks    = data.tasks;
  baseDate = new Date(data.baseDate+'T00:00:00');
  endDate  = data.endDate ? new Date(data.endDate+'T00:00:00') : null;
  if (endDate) {
    const computed = dayOffset(endDate) + 1;
    days = computed > 0 ? computed : (data.days || 30);
    defaultDays = data.days || 30;
  } else {
    days = data.days || 30;
    defaultDays = days;
  }
  // manualCellWByMode restores each view's zoom preference (missing/non-
  // numeric = auto-fit, so older save files without a `zoom` field load
  // exactly as before). Older save files stored one shared number instead
  // of a per-mode object — that shared value was itself the bug this
  // replaced, so on load it's applied only to the mode being viewed right
  // now; the other two views start at auto-fit rather than inheriting it.
  // cellW itself is still always *derived* (via syncCellW), never trusted
  // directly from a save file — an old/foreign raw px value would just be
  // wrong now.
  if (data.zoom && typeof data.zoom === 'object') {
    manualCellWByMode = {
      day:   typeof data.zoom.day   === 'number' ? data.zoom.day   : null,
      week:  typeof data.zoom.week  === 'number' ? data.zoom.week  : null,
      month: typeof data.zoom.month === 'number' ? data.zoom.month : null,
    };
  } else {
    manualCellWByMode = { day: null, week: null, month: null };
    if (typeof data.zoom === 'number') manualCellWByMode[currentMode()] = data.zoom;
  }
  syncCellW(currentMode());
  nextId   = tasks.length ? Math.max(...tasks.map(t=>t.id))+1 : 1;
  startInput.value = data.baseDate;
  endInput.value   = data.endDate || '';
  render();
}

// ── Auto-save (localStorage) ───────────────────────────────────────────
function autoSave() {
  try { localStorage.setItem('gantt_chart', JSON.stringify(chartData())); }
  catch { showToast('⚠️ Could not auto-save — storage full'); }
}

// ── Download JSON ──────────────────────────────────────────────────────
function downloadJSON() {
  const blob = new Blob([JSON.stringify(chartData(), null, 2)], {type:'application/json'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'gantt.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON downloaded');
}

// ── Load JSON from file ────────────────────────────────────────────────
function triggerLoad() { document.getElementById('fileInput').click(); }

// ── Chart canvas rendering (shared by PNG + PDF export) ──────────────────
// Mirrors whatever's on screen: reuses getWeekCols/getMonthCols for column
// layout and dayToX for bar placement — the same functions render() and
// dragging use — so exports can't drift out of sync with the current view
// (day/week/month), zoom, or date range.
//
// Built with { alpha: false } on purpose: the whole canvas is opaque (the
// background fill below covers every pixel), and an alpha-less canvas is
// what lets toDataURL('image/png') emit color-type-2 (plain RGB, no alpha
// plane) PNG data — which canvasToSinglePagePDF depends on so it can embed
// the PNG's already-compressed pixel stream directly as a PDF image XObject
// without decoding/recompressing anything. Don't drop this option without
// updating that function too.
function renderChartCanvas() {
  const DPR     = 2;
  const ROW_H   = 36;
  const LABEL_W = 160;
  const MONTH_H = 20;
  const DAY_H   = 20;
  const HEAD_H  = MONTH_H + DAY_H;

  const cols    = monthMode ? getMonthCols() : weekMode ? getWeekCols() : null;
  const numCols = cols ? cols.length : days;

  const W = LABEL_W + numCols*cellW;
  const H = HEAD_H  + tasks.length*ROW_H;

  const canvas  = document.createElement('canvas');
  canvas.width  = W*DPR; canvas.height = H*DPR;
  const ctx     = canvas.getContext('2d', { alpha: false });
  ctx.scale(DPR,DPR);

  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const C = dark
    ? {bg:'#2a2a28', alt:'#232321', border:'rgba(255,255,255,0.10)',
       borderStrong:'rgba(255,255,255,0.18)',
       text:'#eeecea', muted:'#6e6d69', secondary:'#a8a7a2',
       accent:'#85b7eb', accentBg:'#042c53'}
    : {bg:'#ffffff',  alt:'#f0efeb', border:'rgba(0,0,0,0.12)',
       borderStrong:'rgba(0,0,0,0.20)',
       text:'#1a1a18', muted:'#9a9890', secondary:'#5f5e5a',
       accent:'#185fa5', accentBg:'#e6f1fb'};

  const today    = new Date(); today.setHours(0,0,0,0);
  const todayOff = dayOffset(today);

  // Background
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

  // Mirrors _mutedOverlayHTML: shades the portion of an edge week/month
  // column that falls outside [0, days) — purely cosmetic, like on screen.
  function drawMutedOverlay(c, x, y, h) {
    const leadDays = Math.max(0, Math.min(c.fullSpan, -c.startDay));
    ctx.fillStyle = C.muted; ctx.globalAlpha = 0.25;
    if (leadDays > 0) ctx.fillRect(x, y, (leadDays / c.fullSpan) * cellW, h);
    const trailDays = Math.max(0, (c.startDay + c.fullSpan) - days);
    if (trailDays > 0) {
      const w = (Math.min(trailDays, c.fullSpan) / c.fullSpan) * cellW;
      ctx.fillRect(x + cellW - w, y, w, h);
    }
    ctx.globalAlpha = 1;
  }

  // ── Group row (row1): month spans (day/week mode) or year spans (month mode) ──
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,MONTH_H);
  const groupSpans = [];
  for (let ci = 0; ci < numCols; ci++) {
    const d     = cols ? addDays(baseDate, cols[ci].startDay) : addDays(baseDate, ci);
    const key   = monthMode ? `${d.getFullYear()}` : `${d.getFullYear()}-${d.getMonth()}`;
    const label = monthMode ? `${d.getFullYear()}` : d.toLocaleString('default', {month:'short', year:'numeric'});
    if (!groupSpans.length || groupSpans[groupSpans.length-1].key !== key)
      groupSpans.push({ key, label, start: ci, count: 1 });
    else groupSpans[groupSpans.length-1].count++;
  }

  ctx.font = '600 11px system-ui,sans-serif';
  for (const gs of groupSpans) {
    const x = LABEL_W + gs.start * cellW;
    const w = gs.count * cellW;
    ctx.fillStyle = C.secondary;
    ctx.fillText(gs.label, x + 3, MONTH_H/2 + 4);
    // right border per group
    ctx.strokeStyle = C.border; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x+w, 0); ctx.lineTo(x+w, MONTH_H); ctx.stroke();
  }

  // Group row bottom border (stronger)
  ctx.strokeStyle = C.borderStrong; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(0, MONTH_H); ctx.lineTo(W, MONTH_H); ctx.stroke();

  // Label column header
  ctx.font = '500 12px system-ui,sans-serif'; ctx.fillStyle = C.secondary;
  ctx.fillText('Task', 10, MONTH_H/2 + 4);

  // ── Column row (row2): day numbers, week numbers, or month names ─────────
  for (let ci = 0; ci < numCols; ci++) {
    const x = LABEL_W + ci*cellW;
    const y = MONTH_H;
    if (cols) {
      const c = cols[ci];
      const d = addDays(baseDate, c.startDay);
      const label = monthMode ? d.toLocaleString('default', {month:'short'}) : `Week ${isoWeekNumber(d)}`;
      ctx.font = '11px system-ui,sans-serif'; ctx.fillStyle = C.muted;
      ctx.textAlign = 'center';
      ctx.fillText(label, x + cellW/2, y + DAY_H/2 + 4);
      ctx.textAlign = 'left';
      drawMutedOverlay(c, x, y, DAY_H);
    } else {
      const d    = addDays(baseDate, ci);
      const isWE = d.getDay()===0||d.getDay()===6;
      const isTd = ci===todayOff;
      if (isWE) { ctx.fillStyle=C.alt;      ctx.fillRect(x,y,cellW,DAY_H); }
      if (isTd) { ctx.fillStyle=C.accentBg; ctx.fillRect(x,y,cellW,DAY_H); }
      const show = cellW >= 22 ? ci % 7 === 0 : ci % 14 === 0;
      if (show) {
        ctx.font      = '11px system-ui,sans-serif';
        ctx.fillStyle = isTd ? C.accent : C.muted;
        ctx.textAlign = 'center';
        ctx.fillText(String(d.getDate()), x + cellW/2, y + DAY_H/2 + 4);
        ctx.textAlign = 'left';
      }
    }
    ctx.strokeStyle=C.border; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+DAY_H); ctx.stroke();
  }

  // Column row bottom border
  ctx.strokeStyle=C.border; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(0,HEAD_H); ctx.lineTo(W,HEAD_H); ctx.stroke();

  // Rows
  tasks.forEach((task,ti) => {
    const y = HEAD_H+ti*ROW_H;
    ctx.fillStyle=C.bg; ctx.fillRect(0,y,W,ROW_H);

    for (let ci=0; ci<numCols; ci++) {
      const cx = LABEL_W+ci*cellW;
      if (cols) {
        drawMutedOverlay(cols[ci], cx, y, ROW_H);
      } else {
        const d    = addDays(baseDate,ci);
        const isWE = d.getDay()===0||d.getDay()===6;
        const isTd = ci===todayOff;
        if (isWE) { ctx.fillStyle=C.alt;      ctx.fillRect(cx,y,cellW,ROW_H); }
        if (isTd) { ctx.fillStyle=C.accentBg; ctx.fillRect(cx,y,cellW,ROW_H); }
      }
      ctx.strokeStyle=C.border; ctx.lineWidth=0.5;
      ctx.beginPath(); ctx.moveTo(cx,y); ctx.lineTo(cx,y+ROW_H); ctx.stroke();
    }

    // Row bottom border
    ctx.strokeStyle=C.border; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(0,y+ROW_H); ctx.lineTo(W,y+ROW_H); ctx.stroke();

    // Color dot
    ctx.beginPath(); ctx.arc(20,y+ROW_H/2,5,0,Math.PI*2);
    ctx.fillStyle=task.color; ctx.fill();

    // Task name (truncated)
    ctx.font='13px system-ui,sans-serif'; ctx.fillStyle=C.text;
    let label=task.name;
    const maxW=LABEL_W-34;
    while (ctx.measureText(label).width>maxW && label.length>1) label=label.slice(0,-1);
    if (label!==task.name) label=label.slice(0,-1)+'…';
    ctx.fillText(label, 30, y+ROW_H/2+4);

    // Bar — positioned with dayToX, the same day↔pixel mapping the live
    // grid and dragging use, so it lands correctly in every view mode.
    const barStart=Math.max(0,task.start);
    const barEnd  =Math.min(days,task.start+task.dur);
    if (barStart<days&&barEnd>0) {
      const bx=LABEL_W+dayToX(barStart), bxEnd=LABEL_W+dayToX(barEnd);
      const bw=bxEnd-bx-1, bh=ROW_H-12;
      ctx.fillStyle=task.color;
      ctx.beginPath(); ctx.roundRect(bx,y+6,bw,bh,4); ctx.fill();
      if (bw>20) {
        ctx.font='500 10px system-ui,sans-serif'; ctx.fillStyle='#fff';
        ctx.save(); ctx.beginPath(); ctx.rect(bx+2,y+6,bw-4,bh); ctx.clip();
        ctx.fillText(task.name, bx+6, y+6+bh/2+3); ctx.restore();
      }
    }
  });

  // Label column right border
  ctx.strokeStyle=C.border; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(LABEL_W,0); ctx.lineTo(LABEL_W,H); ctx.stroke();

  // Today line — centered on today the same way updateTodayLine does
  if (showTodayLine && todayOff>=0&&todayOff<days) {
    const tx=LABEL_W+(dayToX(todayOff)+dayToX(todayOff+1))/2;
    ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.globalAlpha=0.7;
    ctx.beginPath(); ctx.moveTo(tx,0); ctx.lineTo(tx,H); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Outer border
  ctx.strokeStyle=dark?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.15)'; ctx.lineWidth=1;
  ctx.strokeRect(0,0,W,H);

  // Stash logical (CSS-pixel, pre-DPR) size for consumers — canvasToSinglePagePDF
  // sizes the PDF page off this, not off canvas.width/height, so the page comes
  // out matching what's on screen rather than the 2x-oversampled pixel grid.
  canvas._logicalW = W; canvas._logicalH = H;
  return canvas;
}

// ── Export PNG ─────────────────────────────────────────────────────────
function exportPNG() {
  const canvas = renderChartCanvas();
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/png'); a.download='gantt.png'; a.click();
  showToast('PNG downloaded');
}

// ── Export PDF ────────────────────────────────────────────────────────
// No PDF library: a PNG's IDAT payload is a zlib stream (RFC 1950), the
// same format PDF's /FlateDecode expects, so ideally we'd drop it straight
// into a hand-built PDF as an image XObject with zero re-encoding.
// That zero-copy path only works for color-type-2 (plain RGB) PNG data,
// though — and while renderChartCanvas asks for a non-alpha canvas via
// { alpha:false } specifically to get that, testing in real headless
// Chromium showed some engines encode RGBA (color-type 6) regardless of
// that hint. So: use the fast zero-copy path when we get RGB, and fall back
// to inflating, stripping the alpha plane via PNG scanline unfiltering, and
// re-deflating as plain RGB (via the browser's native
// Compression/DecompressionStream — no bundled zlib) when we don't.
async function exportPDF() {
  const canvas = renderChartCanvas();
  let blob;
  try {
    blob = await canvasToSinglePagePDF(canvas);
  } catch (err) {
    console.error('PDF export failed:', err);
    showToast('PDF export failed — try Export PNG instead');
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gantt.pdf'; a.click();
  URL.revokeObjectURL(url);
  showToast('PDF downloaded');
}

// Undoes PNG's per-scanline filtering (spec filter types 0–4) to recover
// raw pixel bytes. Needed only for the RGBA fallback path above — the
// zero-copy RGB path never has to look inside the compressed data at all.
function unfilterPNGScanlines(filtered, width, height, bpp) {
  const stride = width * bpp;
  const raw = new Uint8Array(height * stride);
  let fi = 0;
  for (let y = 0; y < height; y++) {
    const filterType = filtered[fi++];
    const rowStart = y * stride;
    for (let x = 0; x < stride; x++) {
      const f = filtered[fi + x];
      const a = x >= bpp ? raw[rowStart + x - bpp] : 0;             // left
      const b = y > 0 ? raw[rowStart - stride + x] : 0;             // up
      const c = (y > 0 && x >= bpp) ? raw[rowStart - stride + x - bpp] : 0; // upper-left
      let val;
      switch (filterType) {
        case 0: val = f; break;
        case 1: val = (f + a) & 0xff; break;
        case 2: val = (f + b) & 0xff; break;
        case 3: val = (f + ((a + b) >> 1)) & 0xff; break;
        case 4: {
          const p = a + b - c;
          const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
          const pr = (pa <= pb && pa <= pc) ? a : (pb <= pc ? b : c);
          val = (f + pr) & 0xff;
          break;
        }
        default: throw new Error('Unknown PNG filter type ' + filterType);
      }
      raw[rowStart + x] = val;
    }
    fi += stride;
  }
  return raw;
}

function stripAlphaChannel(rgba, width, height) {
  const out = new Uint8Array(width * height * 3);
  for (let i = 0, j = 0; i < rgba.length; i += 4, j += 3) {
    out[j] = rgba[i]; out[j+1] = rgba[i+1]; out[j+2] = rgba[i+2];
  }
  return out;
}

// Wraps native CompressionStream/DecompressionStream ('deflate' = zlib/RFC
// 1950 framing, matching both PNG's IDAT format and PDF's /FlateDecode) so
// the rest of the code can just await bytes in, bytes out.
async function pipeThroughStream(stream, bytes) {
  const writer = stream.writable.getWriter();
  writer.write(bytes); writer.close();
  const reader = stream.readable.getReader();
  const chunks = []; let total = 0;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    chunks.push(value); total += value.length;
  }
  const out = new Uint8Array(total);
  let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
const inflateBytes = bytes => pipeThroughStream(new DecompressionStream('deflate'), bytes);
const deflateBytes = bytes => pipeThroughStream(new CompressionStream('deflate'), bytes);

async function canvasToSinglePagePDF(canvas) {
  const png = parsePNGForPDF(canvas.toDataURL('image/png'));
  if (png.bitDepth !== 8 || (png.colorType !== 2 && png.colorType !== 6))
    throw new Error(`Unexpected PNG format for PDF embedding (bitDepth=${png.bitDepth}, colorType=${png.colorType})`);

  let imageBytes, decodeParms;
  if (png.colorType === 2) {
    // Already plain RGB — reuse the compressed bytes verbatim. Predictor 15
    // tells the PDF reader to undo whichever of PNG's 5 row filters the
    // encoder chose per scanline, so it doesn't matter which ones were used.
    imageBytes  = png.idat;
    decodeParms = ` /DecodeParms << /Predictor 15 /Colors 3 /BitsPerComponent 8 /Columns ${png.width} >>`;
  } else {
    const filtered = await inflateBytes(png.idat);
    const raw      = unfilterPNGScanlines(filtered, png.width, png.height, 4);
    const rgb      = stripAlphaChannel(raw, png.width, png.height);
    imageBytes  = await deflateBytes(rgb);
    decodeParms = ''; // freshly deflated, no PNG-style row filtering to undo
  }

  // Page size in points (72/in), derived from CSS-pixel size at the
  // standard 96/in browser reference, so the printed page comes out at the
  // chart's on-screen physical size rather than sized off raw pixel counts
  // (the canvas itself is rendered at 2x those pixel dimensions for
  // crispness — see DPR in renderChartCanvas — which is why we scale the
  // image down to the page with the "cm" matrix below rather than using
  // its pixel size directly).
  const pageW = Math.max(1, canvas._logicalW * 0.75);
  const pageH = Math.max(1, canvas._logicalH * 0.75);

  const enc = new TextEncoder();
  const parts = [];      // array of Uint8Array, concatenated at the end
  const offsets = [null]; // offsets[n] = byte offset of "n 0 obj"; index 0 unused
  let pos = 0;
  function push(bytesOrStr) {
    const bytes = typeof bytesOrStr === 'string' ? enc.encode(bytesOrStr) : bytesOrStr;
    parts.push(bytes);
    pos += bytes.length;
  }
  function beginObj(n) { offsets[n] = pos; push(`${n} 0 obj\n`); }

  push('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');

  beginObj(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  beginObj(2); push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  beginObj(3);
  push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] `
     + `/Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);

  const content = `q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ`;
  beginObj(4);
  push(`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream\nendobj\n`);

  beginObj(5);
  push(`<< /Type /XObject /Subtype /Image /Width ${png.width} /Height ${png.height} `
     + `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /FlateDecode${decodeParms} `
     + `/Length ${imageBytes.length} >>\nstream\n`);
  push(imageBytes);
  push('\nendstream\nendobj\n');

  const xrefStart = pos;
  push(`xref\n0 6\n0000000000 65535 f \n`);
  for (let n = 1; n <= 5; n++) push(`${String(offsets[n]).padStart(10,'0')} 00000 n \n`);
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  return new Blob(parts, { type: 'application/pdf' });
}

// Reads just enough of a data:image/png;base64,... URL to get IHDR fields
// and the concatenated, still-compressed IDAT payload — see
// canvasToSinglePagePDF for why the compressed bytes are used as-is.
function parsePNGForPDF(dataURL) {
  const binary = atob(dataURL.slice(dataURL.indexOf(',') + 1));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const readU32 = off => (bytes[off]<<24 | bytes[off+1]<<16 | bytes[off+2]<<8 | bytes[off+3]) >>> 0;

  let offset = 8; // past the 8-byte PNG signature
  let width, height, bitDepth, colorType;
  const idatChunks = [];
  while (offset < bytes.length) {
    const len  = readU32(offset);
    const type = String.fromCharCode(bytes[offset+4], bytes[offset+5], bytes[offset+6], bytes[offset+7]);
    const dataStart = offset + 8;
    if (type === 'IHDR') {
      width = readU32(dataStart); height = readU32(dataStart + 4);
      bitDepth = bytes[dataStart + 8]; colorType = bytes[dataStart + 9];
    } else if (type === 'IDAT') {
      idatChunks.push(bytes.subarray(dataStart, dataStart + len));
    } else if (type === 'IEND') {
      break;
    }
    offset = dataStart + len + 4; // +4 skips the trailing CRC
  }

  let total = 0; for (const c of idatChunks) total += c.length;
  const idat = new Uint8Array(total);
  let o = 0; for (const c of idatChunks) { idat.set(c, o); o += c.length; }

  return { width, height, bitDepth, colorType, idat };
}

// ── Export dropdown menu ─────────────────────────────────────────────────
function toggleExportMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('exportMenu');
  if (menu.style.display === 'flex') { closeExportMenu(); return; }
  const rect = e.currentTarget.getBoundingClientRect();
  menu.style.cssText = `display:flex;top:${rect.bottom+4+window.scrollY}px;left:${rect.left+window.scrollX}px;`;
}
function closeExportMenu() { document.getElementById('exportMenu').style.display = 'none'; }

document.addEventListener('click', e => {
  if (!e.target.closest('.export-menu') && !e.target.closest('#btnExport')) closeExportMenu();
});

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),400); },1800);
}

// ── Boot ───────────────────────────────────────────────────────────────
(function() {
  try {
    const raw = localStorage.getItem('gantt_chart');
    if (raw) applyChartData(JSON.parse(raw));
    else render();
  } catch { render(); }
})();
